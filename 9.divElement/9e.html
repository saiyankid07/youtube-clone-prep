<!DOCTYPE html>
<html>
    <head>
        <title>Twitter text box</title>
        <link rel="stylesheet" href="styles/7g-styles.css">
    </head>
    <style>
        *{
                 vertical-align: middle;
            }
            .meow{
                width:50px;
                height:50px;
                object-fit: cover;
                border-radius: 40px;
                margin-right: 10px;

                
            }
            .p1{
                margin-left: 0;
                color: grey;
                font-family: arial;
                margin-right:150px;


            }
            .tweet-button{
                padding-right: 20px;
                padding-left: 20px;
                padding-top: 8px;
                padding-bottom: 8px;
                border-radius: 30px;
                border: none;
                background-color:rgb(29, 161, 242) ;
                color: white;
                font-weight: bold;
               

            }
            .box{
                padding: 10px 10px 10px 10px;
                border-radius:3px;
                display: inline-block;
                box-shadow: 0 0 5px black
            }
    </style>

    <body>
        <div class="box">
        <img class="meow" src="images/meow2.jpg" alt="">
        <span class="p1"> What's happening? </span>
        <button class="tweet-button">Tweet</button>
        </div>
    </body>

</html>
