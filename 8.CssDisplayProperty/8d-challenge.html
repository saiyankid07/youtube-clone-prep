<!DOCTYPE html>
<html>
    <head>
        <title>
            Sign up form
        </title>
        <style>
            .first-name{
                width: 130px;
                height:35px;
                padding-left: 15px;
                border-radius: 5px;
                border:solid;
                border-width:1px;
                border-color:rgb(103, 102, 102);
            }
            .last-name{
                width: 130px;
                height:35px;
                padding-left: 15px;
                border-radius: 5px;
                border:solid;
                border-width:1px;
                border-color:rgb(103, 102, 102);
            }
            .email{
                width: 283px;
                height:35px;
                padding-left: 15px;
                border-radius: 5px;
                border:solid;
                border-width:1px;
                border-color:rgb(103, 102, 102);
                display: block;
                margin-top: 10px;
                margin-bottom:10px;
            }
            .button{
                width: 302px;
                height:38px;
                background-color: rgb(31, 120, 246);
                color:white;
                font-weight: bold;
                border-radius:5px;
                font-size: 16px;
                border:none;
            }
        </style>
    </head>
    <body>
        <input class="first-name" type="text" placeholder="First name">
        <input class="last-name" type="text" placeholder="Last name">
        <input class="email" type="text" placeholder="Email">
        <button class="button">Sign Up</button>
    </body>
</html>
